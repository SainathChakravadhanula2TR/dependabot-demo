# =============================================================================
# Dependabot Best Practices Configuration
# =============================================================================
# This file tells GitHub's Dependabot how to automatically manage dependency
# updates for this repository.
#
# WHAT THIS FILE DOES:
#   - Runs dependency checks once a week (Monday mornings) instead of daily
#     so we don't get flooded with PRs every day.
#   - Only opens PRs for minor and patch updates (e.g., 2.28.0 → 2.29.0).
#     It will NOT open PRs for major version bumps (e.g., 2.x → 3.x) because
#     major versions almost always contain breaking changes that need careful
#     human planning.
#   - Groups all updates into a single PR so we get one tidy PR instead of
#     many separate ones.
#   - Caps open PRs at 10 so the PR queue never gets overwhelming.
#
# HOW TO ENABLE THIS:
#   Go to your repo → Settings → Code security and analysis → enable
#   "Dependabot version updates". GitHub will detect this file automatically.
#
# NOTE ON LABELS:
#   The labels below ("dependencies", "python", "automated") must be created
#   manually in your repo first: GitHub → Issues → Labels → New label.
#   Until they exist, Dependabot will skip applying them (PRs still open fine).
# =============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python dependencies (pip / requirements.txt)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"                  # Where requirements.txt lives (repo root)

    schedule:
      interval: "weekly"            # Check once a week, not every day
      day: "monday"                 # Run on Mondays
      time: "09:00"                 # 9am UTC — start of workweek
      timezone: "America/Chicago"   # Adjust to your team's timezone

    # -------------------------------------------------------------------------
    # CRITICAL: Only allow minor and patch updates.
    # We use `allow` (whitelist) rather than `ignore` (blacklist) because pip
    # packages don't always follow strict semver, which can cause `ignore` with
    # update-types to misclassify major bumps and let them through.
    # Using `allow` is more reliable: if it's not minor or patch, it's excluded.
    # -------------------------------------------------------------------------
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    # -------------------------------------------------------------------------
    # GROUPING: Bundle all updates into a single PR instead of one per package.
    # No update-types filter on the group — the `allow` block above already
    # ensures only minor/patch updates reach this point.
    # -------------------------------------------------------------------------
    groups:
      all-dependencies:
        patterns:
          - "*"

    # Cap the number of open Dependabot PRs to avoid queue overflow
    open-pull-requests-limit: 10

    # Label all Dependabot PRs for easy filtering in the PR list.
    # IMPORTANT: create these labels in GitHub (Issues → Labels) before
    # Dependabot can apply them. They won't block PR creation if missing,
    # but the labels won't appear until they exist.
    labels:
      - "dependencies"
      - "python"
      - "automated"

    # Optional: assign a reviewer so PRs don't sit unreviewed.
    # Uncomment and replace with your GitHub username or team slug.
    # reviewers:
    #   - "your-github-username"
    #   - "your-org/your-team"

    # Prefix commit messages so they're easy to find in git log
    commit-message:
      prefix: "chore"
      include: "scope"
